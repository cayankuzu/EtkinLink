name: Mobil staging E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1-5"

permissions:
  contents: read

concurrency:
  group: mobile-staging-e2e
  cancel-in-progress: false

jobs:
  android-maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Staging yapılandırmasını hazırla
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\nSENTRY_DSN=%s\nSENTRY_TRACES_SAMPLE_RATE=1\n' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" "$SENTRY_DSN" > mobile/.env
      - run: npm ci
        working-directory: mobile
      - name: Staging debug APK üret
        shell: bash
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --max-workers=2 -PreactNativeArchitectures=x86_64
        env:
          NODE_ENV: development
      - name: Maestro 2.8.0 kur
        shell: bash
        run: |
          export MAESTRO_VERSION=2.8.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Android E2E akışlarını çalıştır
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        env:
          E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          E2E_EVENT_TITLE: ${{ vars.STAGING_E2E_EVENT_TITLE }}
          E2E_ROOM_TITLE: ${{ vars.STAGING_E2E_ROOM_TITLE }}
          E2E_MATCH_NAME: ${{ vars.STAGING_E2E_MATCH_NAME }}
          E2E_ROOM_MESSAGE: "Maestro oda kritik akış"
          E2E_DIRECT_MESSAGE: "Maestro özel mesaj kritik akış"
          E2E_OFFLINE_MESSAGE: "Maestro offline reconnect kritik akış"
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            test -n "$E2E_EMAIL"
            test -n "$E2E_PASSWORD"
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test \
              mobile/.maestro/01-signed-out.yaml \
              mobile/.maestro/02-signed-in-core.yaml \
              mobile/.maestro/03-critical-ui.yaml \
              -e E2E_EMAIL="$E2E_EMAIL" \
              -e E2E_PASSWORD="$E2E_PASSWORD" \
              -e E2E_EVENT_TITLE="$E2E_EVENT_TITLE" \
              -e E2E_ROOM_TITLE="$E2E_ROOM_TITLE" \
              -e E2E_MATCH_NAME="$E2E_MATCH_NAME" \
              -e E2E_ROOM_MESSAGE="$E2E_ROOM_MESSAGE" \
              -e E2E_DIRECT_MESSAGE="$E2E_DIRECT_MESSAGE" \
              --format junit \
              --output mobile/e2e-results.xml \
              --debug-output mobile/e2e-debug
            maestro test mobile/.maestro/offline/01-open-chat.yaml \
              -e E2E_EMAIL="$E2E_EMAIL" \
              -e E2E_PASSWORD="$E2E_PASSWORD" \
              -e E2E_MATCH_NAME="$E2E_MATCH_NAME"
            adb shell svc wifi disable
            adb shell svc data disable
            maestro test mobile/.maestro/offline/02-send-offline.yaml \
              -e E2E_OFFLINE_MESSAGE="$E2E_OFFLINE_MESSAGE"
            adb shell svc wifi enable
            adb shell svc data enable
            maestro test mobile/.maestro/offline/03-reconnect.yaml \
              -e E2E_OFFLINE_MESSAGE="$E2E_OFFLINE_MESSAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: android-maestro-evidence
          path: |
            mobile/e2e-results.xml
            mobile/e2e-debug
          if-no-files-found: warn
          retention-days: 30

  backend-critical-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging-e2e
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Gerçek staging kritik backend akışlarını çalıştır
        run: npm run e2e:staging-backend
        env:
          TARGET_ENV: staging
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_E2E_EMAIL_DOMAIN: ${{ vars.STAGING_E2E_EMAIL_DOMAIN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: staging-critical-backend-e2e-evidence
          path: mobile/artifacts/staging-critical-e2e.json
          if-no-files-found: error
          retention-days: 30
