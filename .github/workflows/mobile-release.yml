name: Mobil production release kanıtı

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact 40-character release commit SHA from origin/main"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate-target:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
    steps:
      - id: target
        name: Validate immutable release target SHA
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$REQUESTED_TARGET_SHA"
          echo "target_sha=$REQUESTED_TARGET_SHA" >> "$GITHUB_OUTPUT"

  release-evidence:
    needs: validate-target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-target.outputs.target_sha }}
          fetch-depth: 0
      - name: Verify immutable main commit and clean tree
        shell: bash
        env:
          TARGET_SHA: ${{ needs.validate-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Mevcut commit CI, gerçek staging E2E ve 10K kanıtını doğrula
        run: |
          node --test mobile/scripts/check-github-release-evidence.test.mjs
          node mobile/scripts/check-github-release-evidence.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.validate-target.outputs.target_sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-prerequisite-evidence
          path: artifacts/release-prerequisite-evidence.json
          if-no-files-found: error
          retention-days: 30

  android-release:
    needs: [validate-target, release-evidence]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-target.outputs.target_sha }}
          fetch-depth: 0
      - name: Verify immutable main commit and clean tree
        shell: bash
        working-directory: .
        env:
          TARGET_SHA: ${{ needs.validate-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - name: Require approved Android signer fingerprint input
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: npm run release:signer:verify -- --platform=android --preflight
      - name: Production mobil yapılandırmasını hazırla
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\nSENTRY_DSN=%s\nSENTRY_TRACES_SAMPLE_RATE=0.05\n' \
            "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" "$SENTRY_DSN" > .env
      - name: Production keystore hazırla
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/etkinlink-upload.keystore
      - run: npm run release:check -- --strict --platform=android
        env:
          ETKINLINK_UPLOAD_STORE_FILE: etkinlink-upload.keystore
          ETKINLINK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ETKINLINK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ETKINLINK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - run: chmod +x android/gradlew
      - run: ./gradlew :app:bundleRelease --no-daemon --stacktrace --max-workers=2
        working-directory: mobile/android
        env:
          NODE_ENV: production
          ETKINLINK_UPLOAD_STORE_FILE: etkinlink-upload.keystore
          ETKINLINK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ETKINLINK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ETKINLINK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      - name: Signed AAB ve R8 kanıtını doğrula
        shell: bash
        env:
          ETKINLINK_UPLOAD_STORE_FILE: etkinlink-upload.keystore
          ETKINLINK_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ETKINLINK_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ETKINLINK_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          jarsigner -verify -strict android/app/build/outputs/bundle/release/app-release.aab
          npm run release:signer:verify -- --platform=android \
            --android-artifact=android/app/build/outputs/bundle/release/app-release.aab \
            --target-sha="$TARGET_SHA" \
            --output=artifacts/android-signer-identity.json
          npm run release:check -- --strict --platform=android \
            --android-artifact=android/app/build/outputs/bundle/release/app-release.aab \
            --android-mapping=android/app/build/outputs/mapping/release/mapping.txt
      - name: Sentry release ve source map yüklemesini doğrula
        run: npm run sentry:verify-release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_API_BASE_URL: ${{ vars.SENTRY_API_BASE_URL }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etkinlink-production-aab
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/mapping/release/mapping.txt
            mobile/artifacts/android-signer-identity.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove transient Android credentials and environment
        if: always()
        shell: bash
        working-directory: .
        run: rm -f mobile/.env mobile/android/app/etkinlink-upload.keystore

  ios-release:
    needs: [validate-target, release-evidence]
    runs-on: macos-15
    environment: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-target.outputs.target_sha }}
          fetch-depth: 0
      - name: Verify immutable main commit and clean tree
        shell: bash
        working-directory: .
        env:
          TARGET_SHA: ${{ needs.validate-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Require approved iOS signing Team ID input
        env:
          IOS_SIGNING_TEAM_ID: ${{ vars.IOS_SIGNING_TEAM_ID }}
        run: npm run release:signer:verify -- --platform=ios --preflight
      - run: npm run release:check -- --strict --platform=ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: EAS production build sonucunu bekle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const eas = JSON.parse(readFileSync('eas.json', 'utf8'));
          if (
            eas?.build?.production?.channel !== 'production' ||
            eas?.build?.production?.environment !== 'production' ||
            eas?.build?.production?.developmentClient === true ||
            eas?.build?.production?.distribution === 'internal'
          ) {
            throw new Error('eas.json production profile/channel/environment validation failed.');
          }
          NODE
          npx --yes eas-cli@21.0.0 build \
            --platform ios \
            --profile production \
            --non-interactive \
            --json \
            > eas-ios-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          TARGET_SHA: ${{ needs.validate-target.outputs.target_sha }}
      - name: Signed IPA'yı indir ve entitlement'ları doğrula
        shell: bash
        env:
          IOS_SIGNING_TEAM_ID: ${{ vars.IOS_SIGNING_TEAM_ID }}
          TARGET_SHA: ${{ needs.validate-target.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p artifacts/ios-payload
          BUILD_URL="$(node scripts/check-github-release-evidence.mjs \
            --validate-eas-ios-build=eas-ios-build.json \
            --target-sha="$TARGET_SHA")"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --max-redirs 3 \
            --connect-timeout 30 \
            --max-time 600 \
            --max-filesize 1073741824 \
            --retry 3 \
            "$BUILD_URL" \
            --output artifacts/EtkinLink.ipa
          unzip -q artifacts/EtkinLink.ipa -d artifacts/ios-payload
          APP_PATH="$(find artifacts/ios-payload/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > artifacts/ios-entitlements.plist 2>/dev/null
          test "$(plutil -extract aps-environment raw artifacts/ios-entitlements.plist)" = "production"
          CODESIGN_TEAM_ID="$(codesign -dvv "$APP_PATH" 2>&1 | sed -n 's/^TeamIdentifier=//p' | head -n 1)"
          ENTITLEMENT_TEAM_ID="$(plutil -extract com.apple.developer.team-identifier raw artifacts/ios-entitlements.plist)"
          APPLICATION_IDENTIFIER="$(plutil -extract application-identifier raw artifacts/ios-entitlements.plist)"
          npm run release:signer:verify -- --platform=ios \
            --ios-codesign-team-id="$CODESIGN_TEAM_ID" \
            --ios-entitlement-team-id="$ENTITLEMENT_TEAM_ID" \
            --ios-application-identifier="$APPLICATION_IDENTIFIER" \
            --target-sha="$TARGET_SHA" \
            --output=artifacts/ios-signer-identity.json
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          cp "$APP_PATH/PrivacyInfo.xcprivacy" artifacts/PrivacyInfo.xcprivacy
          npm run release:check -- \
            --ios-artifact=artifacts/EtkinLink.ipa \
            --ios-entitlements=artifacts/ios-entitlements.plist \
            --ios-privacy=artifacts/PrivacyInfo.xcprivacy
      - name: iOS Sentry release ve source map yüklemesini doğrula
        run: npm run sentry:verify-release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_API_BASE_URL: ${{ vars.SENTRY_API_BASE_URL }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etkinlink-production-ipa-evidence
          path: |
            mobile/artifacts/EtkinLink.ipa
            mobile/artifacts/ios-entitlements.plist
            mobile/artifacts/ios-signer-identity.json
            mobile/artifacts/PrivacyInfo.xcprivacy
            mobile/eas-ios-build.json
          if-no-files-found: error
          retention-days: 30
