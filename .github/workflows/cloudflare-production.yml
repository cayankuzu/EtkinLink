name: Cloudflare edge production rollout

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact full SHA deployed and tested in preview"
        required: true
        type: string
      preview_run_id:
        description: "Successful cloudflare-preview.yml run ID for target_sha"
        required: true
        type: string
      rollout_percentage:
        description: "Initial traffic percentage for the new Worker version"
        required: true
        default: "10"
        type: string
      preview_runtime_evidence_reference:
        description: "Preview smoke/contract evidence reviewed by the approver"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY_EDGE_SAME_SHA_TO_PRODUCTION"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: inputs.confirmation == 'DEPLOY_EDGE_SAME_SHA_TO_PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: infra/cloudflare/etkinlink-edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/etkinlink-edge/package-lock.json
      - name: Verify immutable production candidate
        id: immutable
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLOUT_PERCENTAGE" =~ ^[0-9]+$ ]]
          (( ROLLOUT_PERCENTAGE >= 1 && ROLLOUT_PERCENTAGE <= 100 ))
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${TARGET_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Validate successful preview deployment evidence
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$PREVIEW_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p artifacts/cloudflare-preview-proof
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIEW_RUN_ID}" > artifacts/cloudflare-preview-proof/run.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const run = JSON.parse(readFileSync('artifacts/cloudflare-preview-proof/run.json', 'utf8'));
          if (run.conclusion !== 'success') throw new Error('Cloudflare preview run did not succeed.');
          if (!String(run.path ?? '').endsWith('/cloudflare-preview.yml')) {
            throw new Error('Run is not cloudflare-preview.yml.');
          }
          NODE
          gh run download "$PREVIEW_RUN_ID" --dir artifacts/cloudflare-preview-proof/download
          PREVIEW_METADATA="$(find artifacts/cloudflare-preview-proof/download -type f -name metadata.json -print -quit)"
          test -n "$PREVIEW_METADATA"
          PREVIEW_METADATA="$PREVIEW_METADATA" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const metadata = JSON.parse(readFileSync(process.env.PREVIEW_METADATA, 'utf8'));
          if (metadata.targetSha !== process.env.TARGET_SHA) throw new Error('Preview SHA mismatch.');
          if (metadata.environment !== 'preview') throw new Error('Preview environment mismatch.');
          if (String(metadata.workflowRunId) !== process.env.PREVIEW_RUN_ID) throw new Error('Preview run ID mismatch.');
          if (!/^\d+$/u.test(String(metadata.qualityRunId ?? ''))) throw new Error('Preview quality run ID is missing.');
          NODE
      - name: Enforce frozen product surface
        working-directory: .
        run: node scripts/guards/check-no-new-product-surface.mjs
      - run: npm ci
      - name: Worker type, lint, format and unit gates
        run: npm run check
      - name: Wrangler production dry-run
        run: npm run dry-run:production
      - name: Validate environment-scoped production origin bindings
        shell: bash
        env:
          ORIGIN_BASE_URL: ${{ vars.ORIGIN_BASE_URL }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE }}
          JWKS_URL: ${{ vars.JWKS_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          PREVIEW_SUPABASE_PROJECT_REF: ${{ vars.PREVIEW_SUPABASE_PROJECT_REF }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
        run: node scripts/validate-deployment-environment.mjs --environment production
      - name: Block unsafe production version mutation
        shell: bash
        working-directory: .
        run: |
          echo "::error::Cloudflare production rollout is intentionally blocked. The workflow must first implement and test an explicit baseline version ID plus idempotent reuse of the same uploaded target version across rollout widening."
          echo "No Cloudflare upload or deployment command has run. Follow docs/cloudflare-architecture.md and keep release status NO-GO."
          exit 1
