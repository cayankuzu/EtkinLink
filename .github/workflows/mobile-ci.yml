name: Mobil kalite kapısı

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  feature-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Fail-closed product surface guard
        run: node scripts/guards/check-no-new-product-surface.mjs
      - name: Guard self-test
        run: node scripts/guards/check-no-new-product-surface.mjs --self-test
      - name: Release evidence manifest tests
        run: node --test scripts/release/generate-evidence-manifest.test.mjs

  quality:
    needs: feature-freeze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run architecture
      - run: npm run deadcode
      - run: npm run security:guards
      - run: npm run compatibility:guards
      - run: npm run performance:guards
      - run: npm run accessibility:guards
      - run: npm run accessibility:guards:test
      - run: npm run hardcode:guards
      - run: npm run hardcode:guards:test
      - run: npm run critical-flows
      - run: npm run ota:classifier:test
      - run: npm run release:signer:test
      - run: npm run release:check
      - run: npm run test:coverage
      - run: npm run coverage:ratchet
      - run: npm run audit:production
      - name: CycloneDX SBOM üret
        shell: bash
        run: |
          mkdir -p ../artifacts
          npm sbom --sbom-format cyclonedx > ../artifacts/mobile-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etkinlink-mobile-sbom
          path: artifacts/mobile-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Must match the pinned CLI in infra/docker/scripts/_common.mjs so
          # the CI and Docker database gates replay on the same toolchain.
          version: 2.116.0
      - name: Izole yerel Supabase veritabanini baslat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/database-security
          supabase db start \
            2>&1 | tee artifacts/database-security/db-start.txt
      - name: Yerel sema guvenligini dogrula
        shell: bash
        run: |
          set -euo pipefail
          supabase db lint --local --schema public --level warning --fail-on warning \
            2>&1 | tee artifacts/database-security/db-lint.txt
          supabase test db --local \
            2>&1 | tee artifacts/database-security/pgtap.txt
      - name: Yerel Supabase veritabanini durdur
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: local-database-security-evidence
          path: artifacts/database-security
          if-no-files-found: error
          retention-days: 30

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.1
          cache: true
      - run: deno fmt --check supabase/functions
      - run: deno lint supabase/functions
      - run: deno check --frozen --node-modules-dir=auto supabase/functions/*/index.ts
      - run: deno test --frozen --node-modules-dir=auto supabase/functions/**/*.test.ts

  cloudflare-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/cloudflare/etkinlink-edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/etkinlink-edge/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run dry-run

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      [
        feature-freeze,
        quality,
        database-security,
        edge-functions,
        cloudflare-edge,
        secret-scan,
      ]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Android derlemesi icin disk alani ac
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/az
          if [[ -d "${ANDROID_HOME}/ndk" ]]; then
            find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d ! -name '27.1.12297006' -print0 \
              | xargs -0 --no-run-if-empty sudo rm -rf
          fi
          sudo apt-get clean
          df -h /
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci
      - run: chmod +x android/gradlew
      - run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --max-workers=2 -PreactNativeArchitectures=arm64-v8a
        working-directory: mobile/android
        env:
          NODE_ENV: development
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: etkinlink-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
